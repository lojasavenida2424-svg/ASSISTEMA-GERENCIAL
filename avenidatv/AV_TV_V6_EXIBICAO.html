<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AV TV — Exibição</title>
<meta name="theme-color" content="#291A1E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --amarelo:#F6C426;
  --preto-logo:#291A1E;
  --muted:#C9B8C1;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
.screen{position:fixed;inset:0;background:#000}
video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.waiting{
  position:absolute;inset:0;display:grid;place-items:center;
  background:
    radial-gradient(circle at top left,rgba(246,196,38,.14),transparent 34%),
    linear-gradient(135deg,#291A1E 0%,#111827 100%);
  color:#fff
}
.waiting.hidden{display:none}
.wait-card{
  width:min(460px,calc(100% - 36px));
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  border-radius:24px;padding:28px;text-align:center;backdrop-filter:blur(12px);
  box-shadow:0 28px 70px rgba(0,0,0,.35)
}
.brand-mark{
  width:72px;height:62px;margin:0 auto 16px;border-radius:20px;
  display:grid;place-items:center;background:var(--amarelo);color:var(--preto-logo);
  font-size:1.25rem;font-weight:1000;letter-spacing:-.04em
}
.wait-card h1{margin:0;font-size:1.4rem;color:var(--amarelo)}
.wait-card p{margin:8px 0 0;color:#E2E8F0;font-weight:700;line-height:1.5;font-size:.9rem}
.loader{width:28px;height:28px;margin:18px auto 0;border:3px solid rgba(255,255,255,.15);border-top-color:var(--amarelo);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.status{
  position:absolute;top:14px;right:14px;display:inline-flex;align-items:center;gap:7px;
  padding:7px 10px;border-radius:999px;background:rgba(15,17,21,.52);color:#fff;
  font-size:.72rem;font-weight:900;backdrop-filter:blur(8px);opacity:.28
}
.status:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--amarelo)}
.error{
  position:absolute;left:50%;bottom:22px;transform:translateX(-50%);
  background:#291A1E;color:#F6C426;padding:12px 16px;border-radius:13px;font-weight:800;display:none
}
</style>
</head>
<body>
<div class="screen">
  <video id="viewer" playsinline></video>

  <div class="waiting" id="waiting">
    <div class="wait-card">
      <div class="brand-mark">AV</div>
      <h1>AV TV</h1>
      <p id="waitText">Aguardando transmissão da central.</p>
      <div class="loader"></div>
    </div>
  </div>

  <div class="status" id="status">conectando</div>
  <div class="error" id="error"></div>
</div>

<script>
const URL_KEY='avenida_tv_url', KEY_KEY='avenida_tv_key', ROOM_KEY='avenida_tv_room';
const DEFAULT_ROOM='avenida-principal';
let sb=null,channel=null,lastState=null,loopEnabled=false;
const video=document.querySelector('#viewer'),waiting=document.querySelector('#waiting'),status=document.querySelector('#status'),errorBox=document.querySelector('#error'),waitText=document.querySelector('#waitText');

function room(){
  const p=new URLSearchParams(location.search);
  return (p.get('room')||localStorage.getItem(ROOM_KEY)||DEFAULT_ROOM).toLowerCase();
}
function currentPosition(st){
  let p=Number(st.position_seconds||0);
  if(st.is_playing&&st.updated_at)p+=(Date.now()-new Date(st.updated_at).getTime())/1000;
  return Math.max(0,p);
}
function showError(m){errorBox.textContent=m;errorBox.style.display='block'}
function sync(st){
  lastState=st;loopEnabled=!!st.loop_enabled;video.loop=loopEnabled;
  status.textContent=(st.is_playing?'reproduzindo':'pausado')+(loopEnabled?' • loop':'');
  if(!st.video_url){
    waitText.textContent='Aguardando transmissão da central.';
    waiting.classList.remove('hidden');
    video.removeAttribute('src');
    return;
  }
  waiting.classList.add('hidden');
  if(video.dataset.url!==st.video_url){
    video.dataset.url=st.video_url;video.src=st.video_url;video.load();
  }
  const target=currentPosition(st);
  const apply=()=>{
    if(Number.isFinite(target)&&Math.abs((video.currentTime||0)-target)>1.2){
      try{video.currentTime=Math.min(target,Number.isFinite(video.duration)?video.duration:target)}catch{}
    }
    if(st.is_playing){
      video.play().catch(()=>{
        waitText.innerHTML='Clique uma vez nesta tela para liberar a reprodução automática.';
        waiting.classList.remove('hidden');
      });
    }else video.pause();
  };
  if(video.readyState>=1)apply();else video.addEventListener('loadedmetadata',apply,{once:true});
}
async function fetchState(){
  if(!sb)return;
  const {data,error}=await sb.from('playback_state').select('*').eq('room',room()).maybeSingle();
  if(error)return showError('Falha de sincronização.');
  if(data)sync(data);
}
async function connect(){
  const u=localStorage.getItem(URL_KEY),k=localStorage.getItem(KEY_KEY);
  if(!u||!k){
    waitText.innerHTML='Este equipamento ainda não foi provisionado.<br>Configure a conexão uma vez e depois use somente esta tela.';
    return;
  }
  sb=window.supabase.createClient(u,k);
  await fetchState();
  channel=sb.channel('playback-display:'+room())
    .on('postgres_changes',{event:'*',schema:'public',table:'playback_state',filter:`room=eq.${room()}`},p=>{if(p.new)sync(p.new)})
    .subscribe();
  status.textContent='conectado';
  setInterval(fetchState,5000);
}
waiting.onclick=()=>{if(lastState?.is_playing)video.play().then(()=>waiting.classList.add('hidden')).catch(()=>{})};
video.onended=()=>{if(loopEnabled&&lastState?.is_playing){video.currentTime=0;video.play().catch(()=>{})}};
connect();
</script>
</body>
</html>
