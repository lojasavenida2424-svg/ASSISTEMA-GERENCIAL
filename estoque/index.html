    /* ESTOQUE AV • LOGIN V1.2 — identidade Avenida S/A · camada própria, sem alterar os módulos internos */
    #auth-root{position:fixed;inset:0;z-index:110;overflow-y:auto;background:#f4f2ec;color:#212121;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    body.auth-locked{overflow:hidden}
    body.auth-locked .app{visibility:hidden;pointer-events:none}
    .auth-scene{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(440px,.92fr);background:#f6f5f2}
    .auth-visual{min-height:100dvh;position:relative;isolation:isolate;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;background:radial-gradient(ellipse at 90% 72%,#6f511d22 0%,transparent 45%),radial-gradient(ellipse at 12% 12%,#434a4c80 0%,transparent 43%),linear-gradient(147deg,#181d20 0%,#14171a 52%,#0e1113 100%);color:#fff;padding:clamp(28px,4.3vw,72px) clamp(28px,5.4vw,100px)}
    .auth-visual:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff06 1px,transparent 1px),linear-gradient(90deg,#ffffff06 1px,transparent 1px);background-size:56px 56px;mask-image:linear-gradient(to bottom,transparent,#000 28%,#000 78%,transparent);pointer-events:none;z-index:-2}
    .auth-visual:after{content:"";position:absolute;width:560px;height:560px;right:-270px;top:18%;border-radius:50%;background:radial-gradient(circle,#edbf5225,transparent 65%);filter:blur(9px);pointer-events:none;z-index:-2}
    .auth-brand{display:flex;align-items:center;gap:14px;position:relative;z-index:2}
    .auth-mark{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#ffe39b 0%,#e8b62e 95%);color:#1d2022;font-size:21px;letter-spacing:-2px;font-weight:950;box-shadow:0 10px 28px #d9a62930;padding-right:3px}
    .auth-brand strong{display:block;color:#fff;font-size:17px;letter-spacing:1.15px;font-weight:850}
    .auth-brand small{display:block;font-size:9px;font-weight:650;letter-spacing:2.8px;color:#aeb6b7;margin-top:4px}
    .auth-hero{position:relative;z-index:1;padding:60px 0 45px;max-width:670px}
    .auth-pretitle{color:#f2c65a;font-size:11px;font-weight:800;letter-spacing:2.9px;display:inline-flex;align-items:center;gap:11px;text-transform:uppercase;margin:0 0 27px}
    .auth-pretitle:before{content:"";width:33px;height:1px;background:#edbb47}
    .auth-hero h2{font-size:clamp(44px,5.1vw,78px);line-height:1.055;letter-spacing:-3.6px;font-weight:810;margin:0 0 26px;max-width:650px}
    .auth-hero h2 em{font-style:normal;color:#ebbb4c}
    .auth-hero>p{max-width:480px;color:#aeb7bb;font-size:15px;line-height:1.9;margin:0}
    .auth-pills{display:flex;flex-wrap:wrap;gap:10px;margin-top:36px}
    .auth-pill{padding:11px 14px;background:#ffffff08;border:1px solid #ffffff16;border-radius:12px;display:flex;gap:9px;align-items:center;color:#d9dfe0;font-size:12px;font-weight:600;backdrop-filter:blur(8px)}
    .auth-pill svg{color:#f2c75f}
    .auth-visual-foot{z-index:1;display:flex;justify-content:space-between;align-items:center;gap:16px;color:#828e93;font-size:11px;letter-spacing:.25px}
    .auth-visual-foot i{height:5px;width:5px;display:inline-block;vertical-align:middle;background:#eac05b;border-radius:50%;margin-right:7px;box-shadow:0 0 12px #eac05b70}
    .auth-art{position:absolute;pointer-events:none;right:7%;top:22%;width:min(39vw,510px);aspect-ratio:1;opacity:.35;transform:rotate(-20deg);z-index:-1}

      if(!['admin','operator'].includes(a.role)||typeof a.active!=='boolean')problems.push('Perfil de conta inválido.');

      <div style="max-height:230px;overflow:auto;margin:12px 0">${summary}</div>

      `<button type="button" class="btn" id="migration-test">Testar login online</button><button type="button" class="btn btn-primary" id="migration-send" ${validated?'':'disabled'}>${ico('upload')} Migrar contas uma vez</button>`,true);
    const endpoint=CLOUD_URL+'/functions/v1/estoque-av-accounts';

    const invoke=async body=>{

  function importBackup(){if(!requireAdmin())return;modal('Restaurar backup','Selecione um JSON gerado pelo ESTOQUE AV. Atenção: na nuvem a restauração substituirá o documento compartilhado.',`<div class="field"><label for="restore-file">Arquivo de backup</label><input type="file" accept=".json,application/json" id="restore-file"></div><div class="notice">${ico('alert')}<span>Essa operação substituirá os dados de todas as lojas no ambiente atual (nuvem, se conectada). Exporte um backup antes de continuar.</span></div>`,`<button class="btn btn-danger" id="restore-go">${ico('upload')} Restaurar arquivo</button>`);$('#restore-go').addEventListener('click',async()=>{try{const file=$('#restore-file').files[0];assert(file,'Selecione o arquivo JSON.');assert(file.size<20*1024*1024,'Arquivo maior que 20 MB.');const obj=JSON.parse(await file.text());assert(obj?.format==='ESTOQUE_AV_BACKUP','Formato de backup não reconhecido.');const d=obj.data; if(d&&!Array.isArray(d.receipts))d.receipts=[];assert(d?.version===1&&Array.isArray(d.stores)&&d.stores.length>0&&Array.isArray(d.products)&&Array.isArray(d.ledger)&&Array.isArray(d.transfers)&&Array.isArray(d.losses)&&Array.isArray(d.inventories),'Dados do backup não são válidos.');assert(d.ledger.every(x=>d.stores.some(s=>s.id===x.storeId)&&d.products.some(p=>p.id===x.productId)&&Number.isSafeInteger(Number(x.delta))&&['deposito','salao'].includes(x.location)),'O backup contém movimentações inconsistentes.');assert(d.receipts.every(r=>d.stores.some(store=>store.id===r.storeId)&&r.quantities&&receiptCats.every(([k])=>Number.isSafeInteger(r.quantities[k])&&r.quantities[k]>=0)&&receiptCats.some(([k])=>r.quantities[k]>0)),'O backup contém recebimentos de caminhão inválidos.');assert(d.transfers.every(x=>x.received>=0&&x.qty>0&&x.qty>=x.received+(x.cancelledQty||0)),'O backup contém transferências inconsistentes.');assert(d.losses.every(x=>!x.photo||Boolean(safeLossPhoto(x.photo))),'O backup contém fotografia em formato inseguro.');const stock={};for(const line of d.ledger){const key=[line.storeId,line.location,line.productId].join('|');stock[key]=(stock[key]||0)+Number(line.delta);assert(stock[key]>=0,'Backup contém histórico de saldo negativo.')}const transferLeft={};for(const t of d.transfers){const key=[t.storeId,t.productId].join('|');transferLeft[key]=(transferLeft[key]||0)+t.qty-t.received-(t.cancelledQty||0)}assert(Object.values(transferLeft).every(x=>x>=0),'Backup inválido.');confirmDialog('Substituir registros','Tem certeza? Os cadastros e movimentações atuais do ambiente selecionado serão substituídos.',()=>{try{if(cloudEnabled){commit(current=>{for(const prop of ['stores','products','ledger','transfers','losses','inventories','receipts'])current[prop]=structuredClone(d[prop])},'Backup restaurado e sincronizado na nuvem.','restore')}else{localStorage.setItem(KEY,JSON.stringify(d));db=d;if(!db.stores.some(s=>s.id===prefs.storeId))prefs.storeId=db.stores[0].id;savePrefs();closeModal();render();toast('Backup restaurado com sucesso.')}}catch(e){toast('Não foi possível restaurar: '+e.message,true)}})}catch(e){toast(e.message,true)}})}

  // Consulta e memória local não fazem cadastro de saldo nem lançamento no estoque.
  let scannerReturn=null,scannerStream=null,scannerJob=null,scannerDetector=null,scannerBeforeFocus=null;
  const parseBarcode=str=>{const s=String(str||'').trim();return /^\d{12}$/.test(s)?{code:s,product:s.slice(0,6),colorCode:s.slice(6,9),sizeCode:s.slice(9,12)}:null};
  function barcodeField(id,label,value='',placeholder='12 dígitos ou referência manual'){
    return `<div class="field"><label for="${id}">${escapeHtml(label)}</label><div class="barcode-input-wrap"><input id="${id}" name="${id}" type="text" inputmode="numeric" value="${escapeHtml(value)}" placeholder="${escapeHtml(placeholder)}" maxlength="80" autocomplete="off"><button type="button" class="barcode-trigger" data-barcode-target="${id}" aria-label="Abrir consulta de produto por código" title="Consultar ou cadastrar dados do produto">${ico('barcode',20)}</button></div></div>`;
  }
  function mountScannerIcons(scope=document){
    scope.querySelectorAll('[data-barcode-target]').forEach(b=>{if(b.dataset.bound)return;b.dataset.bound='1';b.addEventListener('click',()=>openScanner(b.dataset.barcodeTarget))});
    const search=scope.querySelector('[data-scan-search]');
    if(search&&!search.parentNode.querySelector('[data-barcode-target]')){
      const b=document.createElement('button');b.type='button';b.className='barcode-trigger barcode-search-btn';b.setAttribute('aria-label','Consultar produto por código de barras');b.title='Consultar produto';b.innerHTML=ico('barcode',19);b.dataset.barcodeTarget=search.id;search.parentElement.appendChild(b);b.addEventListener('click',()=>openScanner(search.id));
    }
  }
  function stopScannerCamera(){if(scannerJob){clearTimeout(scannerJob);scannerJob=null}if(scannerStream){scannerStream.getTracks().forEach(t=>t.stop());scannerStream=null}scannerDetector=null}
  function closeScanner(){stopScannerCamera();const root=$('#scanner-root');if(root)root.innerHTML='';scannerReturn=null;document.body.classList.remove('scanning-open');scannerBeforeFocus?.focus?.({preventScroll:true});scannerBeforeFocus=null}
  function openScanner(target){
    const source=document.getElementById(target);if(!source){toast('Campo não localizado. Abra o formulário novamente.',true);return}
    if($('#scanner-root')?.firstElementChild)closeScanner();
    scannerBeforeFocus=document.activeElement;scannerReturn=source;
    const initial=parseBarcode(source.value),meta=initial?barcodeMetadata(initial.code):{};
    const parentValue=id=>document.getElementById(id)?.value?.trim()||'';
    const initialFields={description:meta.description||((target==='l-code'||target==='p-barcode')?parentValue(target==='l-code'?'l-name':'p-name'):'')||'',color:meta.color||parentValue(target==='l-code'?'l-color':'p-color'),size:meta.size||parentValue(target==='l-code'?'l-size':'p-size'),family:meta.family||parentValue(target==='l-code'?'l-family':'p-category'),value:meta.value??parentValue(target==='l-code'?'l-value':'p-price')};
    const parsedInitialPrice=priceValue(initialFields.value);const displayPrice=parsedInitialPrice===null||parsedInitialPrice===false?'':money(parsedInitialPrice);
    $('#scanner-root').innerHTML=`<div class="scanner-backdrop" id="scanner-backdrop"><section class="scanner-panel scanner-premium" role="dialog" aria-modal="true" aria-labelledby="scan-title" aria-describedby="scan-desc">
      <header class="scanner-header"><div class="scanner-symbol">${ico('barcode',29)}</div><div class="scanner-heading"><div class="scanner-eyebrow">AVENIDA S/A · IDENTIFICAÇÃO DE MERCADORIAS</div><h2 id="scan-title">Leitor de Código de Barras</h2><p id="scan-desc">Consulte ou complete as informações antes de retornar à tela anterior.</p></div><button type="button" class="scanner-close" id="scanner-close" aria-label="Fechar janela">${ico('close',21)}</button></header>
      <div class="scanner-body">
        <div class="scan-form-row"><label for="scan-description">Descrição do produto</label><div class="scan-input-shell">${ico('box',19)}<input id="scan-description" type="text" maxlength="150" placeholder="Ex.: Camiseta Básica Masculina" value="${escapeHtml(initialFields.description)}" autocomplete="off"></div></div>
        <div class="scan-form-row"><label for="scan-code">Código</label><div class="scan-input-shell scan-code-shell">${ico('barcode',23)}<input id="scan-code" class="scan-code" type="text" maxlength="12" inputmode="numeric" autocomplete="off" placeholder="000000000000" value="${initial?.code||''}" aria-describedby="scan-code-hint"><button type="button" id="scan-clear" class="scan-clear" title="Limpar código" aria-label="Limpar código">${ico('close',17)}</button></div><div id="scan-code-hint" class="scan-code-hint">${ico('info',15)} <span>12 dígitos</span><span>6 produto</span><i>•</i><span>3 cor</span><i>•</i><span>3 tamanho</span></div></div>
        <div class="scan-two-cols"><div class="scan-form-row"><label for="scan-color">Cor <span class="scan-auto">autopreenchimento</span></label><div class="scan-input-shell">${ico('layers',18)}<input id="scan-color" type="text" maxlength="60" placeholder="Não identificada" value="${escapeHtml(initialFields.color)}" autocomplete="off"></div><small class="scan-subcode" id="scan-colorcode">Código da cor: ${initial?.colorCode||'—'}</small></div><div class="scan-form-row"><label for="scan-size">Tamanho <span class="scan-auto">autopreenchimento</span></label><div class="scan-input-shell">${ico('file',18)}<input id="scan-size" type="text" maxlength="40" placeholder="Não identificado" value="${escapeHtml(initialFields.size)}" autocomplete="off"></div><small class="scan-subcode" id="scan-sizecode">Código do tamanho: ${initial?.sizeCode||'—'}</small></div></div>
        <div class="scan-form-row"><label for="scan-value">Valor <span class="scan-extra">R$ · preço de venda</span></label><div class="scan-input-shell">${ico('chart',19)}<span class="scan-currency">R$</span><input id="scan-value" type="text" maxlength="20" inputmode="decimal" placeholder="0,00" value="${escapeHtml(displayPrice.replace(/^R\$\s*/,'') )}" autocomplete="off"></div></div>
        <details class="scan-optional"><summary>Informações complementares <span>Família e identificação</span></summary><div class="scan-form-row"><label for="scan-family">Família</label><div class="scan-input-shell">${ico('layers',18)}<input id="scan-family" type="text" maxlength="80" placeholder="Ex.: Feminino" value="${escapeHtml(initialFields.family)}"></div></div></details>
        <div id="scan-status" class="scan-status" role="status" aria-live="polite">Digite ou leia um código de 12 dígitos.</div>
        <div class="scan-camera-actions"><button type="button" class="scanner-camera-btn" id="scanner-camera">${ico('camera',17)} Ler com câmera</button><span id="scan-message">Leitor USB/Bluetooth: selecione o campo Código e faça a leitura.</span></div>
        <div id="scan-video-wrap" class="scan-video-wrap" hidden><video id="scan-video" autoplay playsinline muted></video><div class="scan-target"></div></div>
      </div>
      <footer class="scanner-footer"><button type="button" class="scan-cancel-btn" id="scanner-cancel">Cancelar</button><button type="button" class="scan-confirm-btn" id="scanner-apply">${ico('check',19)} Confirmar e adicionar</button></footer>
    </section></div>`;
    document.body.classList.add('scanning-open');
    const code=$('#scan-code'),description=$('#scan-description'),color=$('#scan-color'),size=$('#scan-size'),family=$('#scan-family'),value=$('#scan-value'),msg=$('#scan-message');
    let lastCode=initial?.code||'',lookupSource=initial?.code||'';
    function update(){
      const raw=code.value.replace(/\D/g,'').slice(0,12);if(code.value!==raw)code.value=raw;
      const parsed=parseBarcode(raw);
      $('#scan-colorcode').textContent='Código da cor: '+(raw.slice(6,9)||'—');$('#scan-sizecode').textContent='Código do tamanho: '+(raw.slice(9,12)||'—');
      $('#scanner-apply').disabled=!parsed;
      $('#scan-code-hint').classList.toggle('valid',!!parsed);
      if(parsed && parsed.code!==lastCode){
        // Evita mostrar dados da mercadoria anterior ao ler um novo código.
        const known=barcodeMetadata(parsed.code);
        for(const [el,v] of [[description,known.description],[color,known.color],[size,known.size],[family,known.family],[value,known.value==null||known.value===''?'':Number(known.value).toFixed(2).replace('.',',')]])el.value=v??'';
        lastCode=parsed.code;
      }
      if(parsed){
        const stored=db.products.find(p=>p.barcode===raw),cached=readScanHistory()[raw];
        const sourceText=stored?'Já cadastrado no catálogo':cached?'Dados de consulta anterior recuperados':'Novo código · dados para consulta rápida';
        $('#scan-status').innerHTML=ico(stored?'check':'info',17)+`<span><b>${sourceText}</b><small>${stored?'O saldo não será alterado ao confirmar.':cached?'Confira as informações antes de confirmar.':'Preencha os campos disponíveis. Não é necessário cadastrar no estoque geral.'}</small></span>`;
      }else{$('#scan-status').innerHTML=ico('info',17)+'<span>Informe exatamente 12 números para identificar a mercadoria.</span>'}
    }
    code.addEventListener('input',update);
    code.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(parseBarcode(code.value))apply()}});
    $('#scan-clear').addEventListener('click',()=>{code.value='';for(const el of [description,color,size,family,value])el.value='';lastCode='';update();code.focus()});
    function put(id,val,overwrite=true){const el=document.getElementById(id);if(!el||!overwrite||val===null||val===undefined)return;el.value=String(val);el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}))}
    function apply(){
      const parsed=parseBarcode(code.value);if(!parsed){toast('O código deve conter exatamente 12 números.',true);code.focus();return}
      const unit=priceValue(value.value);if(unit===false){toast('Informe um valor válido, por exemplo 79,90.',true);value.focus();return}
      const target=scannerReturn;if(!target?.isConnected){closeScanner();toast('O formulário de origem foi fechado. Abra-o novamente.',true);return}
      const data={description:description.value.trim(),color:color.value.trim(),size:size.value.trim(),family:family.value.trim(),value:unit};
      cacheScan(parsed.code,data);
      // Aplicação contextual sem criar estoque ou gerar entrada/saída.
      put(target.id,parsed.code);
      if(target.id==='p-barcode'){
        put('p-ref',parsed.product);put('p-name',data.description);put('p-color',data.color);put('p-size',data.size);put('p-category',data.family);put('p-price',unit===null?'':String(unit).replace('.',','));
      }else if(target.id==='l-code'){
        put('l-name',data.description);put('l-color',data.color);put('l-size',data.size);put('l-family',data.family);put('l-value',unit===null?'':String(unit).replace('.',','));
        const extra=$('#loss-extra');if(extra&&(data.color||data.size||data.family||unit!==null))extra.open=true;
      }
      closeScanner();const restored=document.getElementById(target.id);restored?.focus({preventScroll:true});
      toast(target.id==='list-search'?'Código aplicado à pesquisa.':'Produto identificado e adicionado ao formulário.');
    }
    $('#scanner-apply').addEventListener('click',apply);$('#scanner-close').addEventListener('click',closeScanner);$('#scanner-cancel').addEventListener('click',closeScanner);
    $('#scanner-backdrop').addEventListener('mousedown',e=>{if(e.target.id==='scanner-backdrop')closeScanner()});
    $('#scanner-camera').addEventListener('click',async()=>{
      if(scannerStream){stopScannerCamera();$('#scan-video-wrap').hidden=true;$('#scanner-camera').innerHTML=ico('camera',17)+' Ler com câmera';return}
      if(!window.isSecureContext){msg.textContent='A câmera exige HTTPS ou localhost; utilize leitor físico ou digite o código.';return}
      if(!navigator.mediaDevices?.getUserMedia||!('BarcodeDetector' in window)){msg.textContent='Câmera indisponível neste navegador. Digite ou utilize um leitor físico.';return}
      try{scannerDetector=new BarcodeDetector({formats:['code_128','ean_13','ean_8','itf','code_39','upc_a']});scannerStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});const video=$('#scan-video');if(!video){stopScannerCamera();return}video.srcObject=scannerStream;$('#scan-video-wrap').hidden=false;await video.play();$('#scanner-camera').innerHTML=ico('close',17)+' Desligar câmera';msg.textContent='Aponte a câmera para o código de 12 dígitos.';
        const loop=async()=>{if(!scannerStream||!$('#scan-video'))return;try{const results=await scannerDetector.detect(video);const match=results.map(x=>String(x.rawValue||'').replace(/\D/g,'')).find(x=>parseBarcode(x));if(match){code.value=match;update();stopScannerCamera();$('#scan-video-wrap').hidden=true;$('#scanner-camera').innerHTML=ico('camera',17)+' Ler com câmera';msg.textContent='Código identificado. Confira os dados antes de confirmar.';return}}catch(err){console.warn('Leitura indisponível',err)}scannerJob=setTimeout(loop,280)};loop();
      }catch(err){stopScannerCamera();msg.textContent='Não foi possível acessar a câmera: '+(err.name==='NotAllowedError'?'permissão não concedida.':err.message)}
    });
    update();code.focus({preventScroll:true});
  }

  const actionMap={cloudConnectModal,cloudMigrateLocal,cloudForceRefresh,cloudDisconnectAsk,accountMigrationModal,userCreate,userEdit,userReset,userToggle,userDelete,receiptModal,receiptDetail,exportReceipts,accountModal,productModal,productDetail,movementModal,transferModal,receiveModal,transferDetail,lossModal,lossDetail,inventoryNew,inventoryDetail,storeModal,operatorModal,exportProducts,exportMovement,exportLosses,exportBackup,importBackup,switchStore:id=>{prefs.storeId=id;savePrefs();render()},themeSwitch:()=>{prefs.theme=prefs.theme==='dark'?'light':'dark';savePrefs();render()},print:()=>window.print()};
  function bindContent(){const c=$('#content');c.querySelectorAll('[data-settings-tab]').forEach(button=>button.addEventListener('click',()=>setSettingsTab(button.dataset.settingsTab)));c.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>{const fn=actionMap[el.dataset.action];if(fn)fn(el.dataset.id)}));c.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>setPage(el.dataset.page)));const search=c.querySelector('#list-search');if(search){search.addEventListener('input',e=>{const value=e.target.value,pos=e.target.selectionStart;searchValue=value;const page=prefs.page;const rerender={products:productsPage,movement:movementPage,losses:lossesPage,receipts:receiptsPage}[page];if(rerender){c.innerHTML=rerender();bindContent();const inp=c.querySelector('#list-search');if(inp){inp.focus();inp.setSelectionRange(pos,pos)}}})}mountScannerIcons(c);const select=c.querySelector('#list-filter');if(select)select.addEventListener('change',e=>{filterValue=e.target.value;const page=prefs.page;const rerender={products:productsPage,movement:movementPage,losses:lossesPage,transfers:transfersPage,receipts:receiptsPage}[page];if(rerender){c.innerHTML=rerender();bindContent()}})}
  $('#overlay-mobile').addEventListener('click',()=>{$('#sidebar').classList.remove('open');$('#overlay-mobile').classList.remove('show')});window.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#scanner-root')?.firstElementChild)closeScanner();else if(e.key==='Escape'&&modalState)closeModal()});window.addEventListener('storage',e=>{if(e.key===ACCOUNTS_KEY){const own=accounts().find(a=>a.id===sessionUser?.id&&a.active);if(sessionUser&&!own){logout();toast('Seu acesso foi alterado em outra aba.',true)}else if(sessionUser)render()}if(e.key===KEY){if(!cloudEnabled){db=loadData();render();toast('Dados locais atualizados de outra aba.')}else if(!cloudBusy)cloudPull({quiet:true,preserveModal:!!modalState}) }});
  boot();
  </script>
