    /* ESTOQUE AV • LOGIN V1.2 — identidade Avenida S/A · camada própria, sem alterar os módulos internos */
    #auth-root{position:fixed;inset:0;z-index:110;overflow-y:auto;background:#f4f2ec;color:#212121;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    body.auth-locked{overflow:hidden}
    body.auth-locked .app{visibility:hidden;pointer-events:none}
    .auth-scene{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(440px,.92fr);background:#f6f5f2}
    .auth-visual{min-height:100dvh;position:relative;isolation:isolate;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;background:radial-gradient(ellipse at 90% 72%,#6f511d22 0%,transparent 45%),radial-gradient(ellipse at 12% 12%,#434a4c80 0%,transparent 43%),linear-gradient(147deg,#181d20 0%,#14171a 52%,#0e1113 100%);color:#fff;padding:clamp(28px,4.3vw,72px) clamp(28px,5.4vw,100px)}
    .auth-visual:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff06 1px,transparent 1px),linear-gradient(90deg,#ffffff06 1px,transparent 1px);background-size:56px 56px;mask-image:linear-gradient(to bottom,transparent,#000 28%,#000 78%,transparent);pointer-events:none;z-index:-2}
    .auth-visual:after{content:"";position:absolute;width:560px;height:560px;right:-270px;top:18%;border-radius:50%;background:radial-gradient(circle,#edbf5225,transparent 65%);filter:blur(9px);pointer-events:none;z-index:-2}
    .auth-brand{display:flex;align-items:center;gap:14px;position:relative;z-index:2}
    .auth-mark{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#ffe39b 0%,#e8b62e 95%);color:#1d2022;font-size:21px;letter-spacing:-2px;font-weight:950;box-shadow:0 10px 28px #d9a62930;padding-right:3px}
    .auth-brand strong{display:block;color:#fff;font-size:17px;letter-spacing:1.15px;font-weight:850}
    .auth-brand small{display:block;font-size:9px;font-weight:650;letter-spacing:2.8px;color:#aeb6b7;margin-top:4px}
    .auth-hero{position:relative;z-index:1;padding:60px 0 45px;max-width:670px}
    .auth-pretitle{color:#f2c65a;font-size:11px;font-weight:800;letter-spacing:2.9px;display:inline-flex;align-items:center;gap:11px;text-transform:uppercase;margin:0 0 27px}
    .auth-pretitle:before{content:"";width:33px;height:1px;background:#edbb47}
    .auth-hero h2{font-size:clamp(44px,5.1vw,78px);line-height:1.055;letter-spacing:-3.6px;font-weight:810;margin:0 0 26px;max-width:650px}
    .auth-hero h2 em{font-style:normal;color:#ebbb4c}
    .auth-hero>p{max-width:480px;color:#aeb7bb;font-size:15px;line-height:1.9;margin:0}
    .auth-pills{display:flex;flex-wrap:wrap;gap:10px;margin-top:36px}
    .auth-pill{padding:11px 14px;background:#ffffff08;border:1px solid #ffffff16;border-radius:12px;display:flex;gap:9px;align-items:center;color:#d9dfe0;font-size:12px;font-weight:600;backdrop-filter:blur(8px)}
    .auth-pill svg{color:#f2c75f}
    .auth-visual-foot{z-index:1;display:flex;justify-content:space-between;align-items:center;gap:16px;color:#828e93;font-size:11px;letter-spacing:.25px}
    .auth-visual-foot i{height:5px;width:5px;display:inline-block;vertical-align:middle;background:#eac05b;border-radius:50%;margin-right:7px;box-shadow:0 0 12px #eac05b70}
    .auth-art{position:absolute;pointer-events:none;right:7%;top:22%;width:min(39vw,510px);aspect-ratio:1;opacity:.35;transform:rotate(-20deg);z-index:-1}
    .auth-art .ring{position:absolute;inset:5%;border:1px solid #dcad4655;border-radius:32%;transform:rotate(35deg);box-shadow:0 0 38px #e1aa3011,inset 0 0 36px #e1aa3011}
    .auth-art .ring:nth-child(2){inset:18%;transform:rotate(59deg);border-color:#f0cf7a70}
    .auth-art .ring:nth-child(3){inset:30%;transform:rotate(75deg);border-color:#ffffff45;background:linear-gradient(125deg,#f2ce7e24,transparent 70%)}
    .auth-form-side{min-height:100dvh;padding:40px clamp(28px,5.5vw,104px);display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(circle at 85% 0,#f8e9bd58,transparent 32%),#f7f6f3}
    .auth-pane{width:100%;max-width:440px;padding:15px 0}
    .auth-topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:clamp(34px,5vh,60px);gap:12px}
    .auth-topline>span{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#858781}
    .auth-status{display:flex;align-items:center;gap:8px;color:#74766f;font-size:11px;font-weight:680}
    .auth-status:before{content:"";width:7px;height:7px;background:#39a477;border-radius:50%}
    .auth-greeting{display:inline-grid;place-items:center;width:62px;height:62px;border-radius:19px;background:#f1e6ca;color:#966c1b;margin-bottom:24px;box-shadow:inset 0 0 0 1px #e3d7ba}
    .auth-pane h1{font-weight:820;font-size:clamp(29px,3vw,40px);letter-spacing:-1.5px;line-height:1.12;color:#1c2529;margin:0 0 13px}
    .auth-subtitle{font-size:14px;line-height:1.8;color:#777f80;margin:0 0 31px}
    .auth-form{display:flex;flex-direction:column;gap:17px}
    .auth-field>label{font-size:12px;font-weight:750;color:#3b4549;display:block;margin-bottom:9px}
    .auth-input-wrap{position:relative;display:flex;align-items:center}
    .auth-input-wrap>svg{position:absolute;left:16px;color:#9aa1a0;pointer-events:none}
    .auth-input{display:block;width:100%;height:54px;border:1px solid #dedfda;border-radius:13px;background:#fff!important;box-shadow:0 3px 12px #18202b06;color:#242d31!important;padding:0 52px 0 47px!important;outline:none;font-size:14px;transition:border .18s,box-shadow .18s}
    .auth-input:focus{border-color:#c7a24d!important;box-shadow:0 0 0 4px #edd3963a!important}
    .auth-input::placeholder{color:#abb0af}
    .auth-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:36px;height:36px;border:0;background:transparent;color:#7f8989;border-radius:9px}
    .auth-eye:hover{background:#f6f5f1;color:#394044}
    .auth-between{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:19px;margin:1px 0 3px}
    .auth-remember{display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:12px;color:#616b6d}
    .auth-remember input{width:16px;height:16px;accent-color:#ddb042;cursor:pointer}
    .auth-helper{font-size:11px;color:#a3a7a1}
    .auth-forgot-link{border:0;background:transparent;padding:4px 0;color:#94752d;font:inherit;font-size:11px;font-weight:700;text-decoration:underline;cursor:pointer;white-space:nowrap}
    .auth-forgot-link:hover{color:#705317}
    .auth-forgot-link:focus-visible{outline:2px solid #c89c2e;outline-offset:3px;border-radius:3px}
    .auth-submit{margin-top:4px;border:1px solid #e5b843;background:linear-gradient(125deg,#f6d47a,#e9b840);color:#1c2121;min-height:55px;width:100%;border-radius:13px;font-size:14px;letter-spacing:.1px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:11px;box-shadow:0 10px 26px #dca83b38;transition:transform .2s,box-shadow .2s}
    .auth-submit:hover{transform:translateY(-1px);box-shadow:0 13px 27px #dca83b4d}
    .auth-submit:disabled{opacity:.6;cursor:wait;transform:none}
    .auth-error{min-height:0;color:#ac3440;font-size:12px;line-height:1.5;display:none;background:#fff0f0;border:1px solid #f6cccc;border-radius:10px;padding:11px 13px}
    .auth-error:not(:empty){display:block}
    .auth-info{margin-top:30px;padding-top:24px;border-top:1px solid #e3e4de;color:#939995;font-size:11px;line-height:1.75;display:flex;gap:10px;align-items:flex-start}
    .auth-info svg{color:#aa8b40;flex-shrink:0;margin-top:1px}
    .auth-local-setup{display:block;margin:12px auto 0;padding:8px 12px;border:0;background:transparent;color:#94752d;font-weight:600;font-size:12px;font-family:inherit;text-decoration:underline;cursor:pointer}
    .auth-form-note{font-size:11px;color:#9ba19d;line-height:1.65;margin-top:17px;text-align:center}
    .auth-footer-mobile{display:none}

    /* AV V1.6 — leitor universal, recebimento e preenchimento inteligente */
    .barcode-input-wrap{position:relative;display:flex;align-items:center;min-width:0}
    .barcode-input-wrap>input{padding-right:53px!important}
    .barcode-trigger{display:inline-flex;align-items:center;justify-content:center;border:1px solid #e6cf94;background:#fff8e4;color:#8a631c;border-radius:10px;min-width:39px;height:38px;cursor:pointer;flex-shrink:0;transition:.15s}
    .barcode-trigger:hover{background:#f5d883;color:#433016;transform:translateY(-1px)}
    .barcode-input-wrap .barcode-trigger{position:absolute;right:3px;top:2px}
    .search .barcode-search-btn{height:30px;min-width:34px;margin-right:-5px}
    .scanner-backdrop{position:fixed;inset:0;z-index:100000;background:#11141bd1;backdrop-filter:blur(11px);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
    .scanner-panel{width:min(680px,100%);max-height:min(94dvh,900px);overflow-y:auto;background:var(--card);color:var(--ink);border-radius:25px;border:1px solid var(--stroke);box-shadow:0 30px 110px #0007}
    .scanner-header{padding:24px 27px 20px;display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--stroke)}
    .scanner-header .scanner-symbol{flex-shrink:0;display:grid;place-items:center;width:50px;height:50px;border-radius:14px;background:linear-gradient(135deg,#fce1a2,#e6b232);color:#312716}
    .scanner-header>div:nth-child(2){flex:1;min-width:0}.scanner-header h2{font-size:21px;letter-spacing:-.5px;margin:2px 0 5px}.scanner-header p{font-size:12px;color:var(--muted);margin:0;line-height:1.5}
    .scanner-body{padding:25px 27px 18px}.scan-code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace!important;font-size:22px!important;letter-spacing:2px;font-weight:800;min-height:55px!important}
    .scan-split{display:grid;grid-template-columns:2fr 1fr 1fr;gap:7px;margin:2px 0 8px}.scan-split>span{display:flex;gap:4px;flex-direction:column;align-items:center;justify-content:center;background:var(--soft);border:1px solid var(--stroke);padding:11px 3px;border-radius:12px;font-size:9px;letter-spacing:1px;font-weight:800;color:var(--muted)}
    .scan-split b{font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:2px;color:var(--ink)}.scan-split small{font-size:10px;letter-spacing:0;font-weight:500}
    .scan-camera-actions{display:flex;align-items:center;flex-wrap:wrap;gap:13px;margin-top:17px}.scan-camera-actions span{flex:1;min-width:160px}.scan-video-wrap{margin-top:13px;position:relative;overflow:hidden;border-radius:14px;background:#08090b;max-height:240px}.scan-video-wrap[hidden]{display:none}.scan-video-wrap video{width:100%;height:230px;object-fit:cover}.scan-target{position:absolute;inset:20% 9%;border:2px solid #f3c455;border-radius:12px;box-shadow:0 0 0 100vmax #0004;pointer-events:none}
    .scanner-footer{display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--stroke);padding:18px 27px;background:var(--soft);border-radius:0 0 25px 25px}
    .receipt-intro{display:flex;gap:12px;align-items:center;padding:13px 16px;margin-bottom:20px;border:1px solid #f1deb1;background:#fff9e9;color:#805f24;font-size:11px;font-weight:850;letter-spacing:1px;border-radius:12px}.receipt-subtitle{font-weight:830;font-size:13px;margin-top:9px;padding:7px 0;border-bottom:1px solid var(--stroke)}
    .receipt-summary{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--soft);border:1px solid var(--stroke);margin-top:16px;padding:18px;border-radius:13px;font-size:13px}.receipt-summary strong{font-size:20px}
    body.dark .receipt-intro{background:#30271b;color:#f3d08d;border-color:#4f4026}body.dark .barcode-trigger{background:#312b20;color:#f5d277;border-color:#5b4a2b}
    @media(max-width:650px){.scanner-backdrop{padding:8px;align-items:flex-end}.scanner-panel{max-height:96dvh;border-radius:23px 23px 13px 13px}.scanner-header{padding:18px 17px 13px}.scanner-header h2{font-size:18px}.scanner-body{padding:16px 17px}.scanner-footer{padding:14px 17px}.scan-split b{font-size:15px}.receipt-summary strong{font-size:17px}}


    /* V1.6 — operação ágil, acessibilidade e menos digitação */
    .field:focus-within>label{color:var(--ink)}
    .modal .field input:focus,.modal .field select:focus,.modal .field textarea:focus{outline:2px solid #e7b943;outline-offset:1px}
    .field.error input,.field.error select,.field.error textarea{border-color:#c63940!important;box-shadow:0 0 0 2px #c6394022!important}
    .validation-inline{margin-top:10px;color:#b42932;font-size:12px;font-weight:650;display:flex;align-items:center;gap:6px}
    .form-block-heading{grid-column:1/-1;font-size:11px;letter-spacing:.6px;font-weight:900;text-transform:uppercase;color:var(--muted);padding:10px 0 6px;border-bottom:1px solid var(--stroke)}
    .form-help{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:5px;line-height:1.5}
    .field-steps{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;align-items:stretch;gap:6px}
    .field-steps>input{width:100%;text-align:center;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
    .step-control{border:1px solid var(--stroke);border-radius:10px;background:var(--soft);color:var(--ink);font-size:23px;font-weight:600;cursor:pointer;min-height:43px}
    .step-control:hover{border-color:#d2ab49;background:#edd48b35}
    .quick-quantities{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
    .quick-quantities button{background:var(--soft);color:var(--muted);border:1px solid var(--stroke);border-radius:7px;padding:5px 9px;font-weight:750;font-size:11px;cursor:pointer}
    .quick-quantities button:hover{color:var(--ink);border-color:#d9b65c}
    .draft-indicator{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;line-height:1.5}
    .form-subtle-card{background:var(--soft);padding:15px 16px;border:1px solid var(--stroke);border-radius:13px}
    .form-subtle-card>summary{cursor:pointer;font-size:13px;font-weight:800;list-style-position:inside}
    .form-subtle-card .form-grid{margin-top:13px}
    .product-lookup{margin-top:6px;display:flex;gap:8px;align-items:center}
    .product-lookup input{font-size:12px!important}
    .product-lookup-counter{font-size:11px;color:var(--muted);white-space:nowrap}
    .scan-recent{font-size:11px;line-height:1.6;color:var(--muted);margin-top:8px}
    .scan-recent b{color:var(--ink)}
    .input-count-split{display:flex;gap:6px;align-items:center;margin-top:7px;flex-wrap:wrap}

  function authTemplate(mode='login'){
    if(mode==='forgot-password')return `<div class="auth-scene"><section class="auth-visual" aria-label="Apresentação do Estoque AV"><div class="auth-art" aria-hidden="true"><i class="ring"></i><i class="ring"></i><i class="ring"></i></div><div class="auth-brand">${avenueLogo('large')}<div><strong>AVENIDA <span class="brand-sa">S/A</span></strong><small>ESTOQUE AV · SISTEMA OPERACIONAL</small></div></div><div class="auth-hero"><div class="auth-pretitle">RECUPERAÇÃO DE ACESSO</div><h2>Vamos recuperar sua <em>senha.</em></h2><p>Confirme seus dados do Gerencial para enviar uma solicitação ao desenvolvedor.</p></div><div class="auth-visual-foot"><span><i></i> Acesso autorizado pelo Gerencial</span><span>LOJAS AVENIDA S/A</span></div></section><section class="auth-form-side"><div class="auth-pane"><div class="auth-topline"><span>AVENIDA S/A · ESTOQUE</span><span class="auth-status">Solicitação protegida</span></div><div class="auth-greeting">${avenidaLogo()}</div><h1>Esqueci a senha</h1><p class="auth-subtitle">Informe os dados exatamente como aparecem no Gerencial. O desenvolvedor receberá sua solicitação para redefinir a senha.</p><form class="auth-form" id="auth-form" autocomplete="on" novalidate><div class="auth-field"><label for="recovery-name">NOME COMPLETO</label><div class="auth-input-wrap">${htmlAuthIcon('user',18)}<input class="auth-input" type="text" id="recovery-name" autocomplete="name" maxlength="120" required></div></div><div class="auth-field"><label for="recovery-birth">DATA DE NASCIMENTO</label><div class="auth-input-wrap">${htmlAuthIcon('calendar',18)}<input class="auth-input" type="date" id="recovery-birth" autocomplete="bday" required></div></div><div class="auth-field"><label for="recovery-operator">OPERADOR</label><div class="auth-input-wrap">${htmlAuthIcon('user',18)}<input class="auth-input" type="text" id="recovery-operator" inputmode="numeric" pattern="[0-9]{3,}" placeholder="Número do operador" required></div></div><div id="auth-error" class="auth-error" role="alert" aria-live="polite"></div><button class="auth-submit" id="auth-submit" type="submit"><span>Enviar solicitação</span>${htmlAuthIcon('right',19)}</button></form><button type="button" class="auth-local-setup" id="auth-recovery-back">Voltar ao login</button><div class="auth-footer-mobile">LOJAS AVENIDA S/A · ESTOQUE AV</div></div></section></div>`;
    const setup=mode==='set-password',remembered=(()=>{try{return localStorage.getItem(REMEMBER_KEY)||''}catch{return ''}})(),authorized=pendingFirstUse;
    return `<div class="auth-scene"><section class="auth-visual" aria-label="Apresentação do Estoque AV">
      <div class="auth-art" aria-hidden="true"><i class="ring"></i><i class="ring"></i><i class="ring"></i></div>

      const parsed=parseBarcode(code.value);if(!parsed){toast('O código deve conter exatamente 12 números.',true);code.focus();return}
      const unit=priceValue(value.value);if(unit===false){toast('Informe um valor válido, por exemplo 79,90.',true);value.focus();return}
      const target=scannerReturn;if(!target?.isConnected){closeScanner();toast('O formulário de origem foi fechado. Abra-o novamente.',true);return}
      const data={description:description.value.trim(),color:color.value.trim(),size:size.value.trim(),family:family.value.trim(),value:unit};
      cacheScan(parsed.code,data);
      // Aplicação contextual sem criar estoque ou gerar entrada/saída.
      put(target.id,parsed.code);
      if(target.id==='p-barcode'){
        put('p-ref',parsed.product);put('p-name',data.description);put('p-color',data.color);put('p-size',data.size);put('p-category',data.family);put('p-price',unit===null?'':String(unit).replace('.',','));
      }else if(lossPrefix){
        put(`${lossPrefix}-name`,data.description);put(`${lossPrefix}-color`,data.color);put(`${lossPrefix}-size`,data.size);put(`${lossPrefix}-family`,data.family);put(`${lossPrefix}-value`,unit===null?'':String(unit).replace('.',','));
      }
      closeScanner();const restored=document.getElementById(target.id);restored?.focus({preventScroll:true});
      toast(target.id==='list-search'?'Código aplicado à pesquisa.':'Produto identificado e adicionado ao formulário.');
    }
    $('#scanner-apply').addEventListener('click',apply);$('#scanner-close').addEventListener('click',closeScanner);$('#scanner-cancel').addEventListener('click',closeScanner);
    $('#scanner-backdrop').addEventListener('mousedown',e=>{if(e.target.id==='scanner-backdrop')closeScanner()});
    $('#scanner-camera').addEventListener('click',async()=>{
      if(scannerStream){stopScannerCamera();$('#scan-video-wrap').hidden=true;$('#scanner-camera').innerHTML=ico('camera',17)+' Ler com câmera';return}
      if(!window.isSecureContext){msg.textContent='A câmera exige HTTPS ou localhost; utilize leitor físico ou digite o código.';return}
      if(!navigator.mediaDevices?.getUserMedia||!('BarcodeDetector' in window)){msg.textContent='Câmera indisponível neste navegador. Digite ou utilize um leitor físico.';return}
      try{scannerDetector=new BarcodeDetector({formats:['code_128','ean_13','ean_8','itf','code_39','upc_a']});scannerStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});const video=$('#scan-video');if(!video){stopScannerCamera();return}video.srcObject=scannerStream;$('#scan-video-wrap').hidden=false;await video.play();$('#scanner-camera').innerHTML=ico('close',17)+' Desligar câmera';msg.textContent='Aponte a câmera para o código de 12 dígitos.';
        const loop=async()=>{if(!scannerStream||!$('#scan-video'))return;try{const results=await scannerDetector.detect(video);const match=results.map(x=>String(x.rawValue||'').replace(/\D/g,'')).find(x=>parseBarcode(x));if(match){code.value=match;update();stopScannerCamera();$('#scan-video-wrap').hidden=true;$('#scanner-camera').innerHTML=ico('camera',17)+' Ler com câmera';msg.textContent='Código identificado. Confira os dados antes de confirmar.';return}}catch(err){console.warn('Leitura indisponível',err)}scannerJob=setTimeout(loop,280)};loop();
      }catch(err){stopScannerCamera();msg.textContent='Não foi possível acessar a câmera: '+(err.name==='NotAllowedError'?'permissão não concedida.':err.message)}
    });
    update();code.focus({preventScroll:true});
  }

  const actionMap={cloudConnectModal,cloudSendLocalBackup,cloudForceRefresh,cloudDisconnectAsk,userCreate,userAuthorize,userRevoke,userApproveReset,userRejectReset,userRefresh,userChangeOwnPassword,userEdit,userReset,userToggle,userDelete,fiscalChecklist,fiscalDetail,measurementModal,measurementDelete,receiptModal,receiptDetail,exportReceipts,accountModal,productModal,productDetail,movementModal,transferModal,receiveModal,transferDetail,lossModal,lossDetail,lossEditModal,inventoryNew,inventoryDetail,storeModal,operatorModal,exportProducts,exportMovement,exportLosses,exportBackup,importBackup,switchStore:id=>{prefs.storeId=id;savePrefs();render()},themeSwitch:()=>{prefs.theme=prefs.theme==='dark'?'light':'dark';savePrefs();render()},print:()=>window.print()};
  function bindContent(){const c=$('#content');c.querySelectorAll('[data-settings-tab]').forEach(button=>button.addEventListener('click',()=>setSettingsTab(button.dataset.settingsTab)));c.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>{const fn=actionMap[el.dataset.action];if(fn)fn(el.dataset.id)}));c.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>setPage(el.dataset.page)));const search=c.querySelector('#list-search');if(search){search.addEventListener('input',e=>{const value=e.target.value,pos=e.target.selectionStart;searchValue=value;const page=prefs.page;const rerender={products:productsPage,losses:lossesPage,receipts:receiptsPage}[page];if(rerender){c.innerHTML=rerender();bindContent();const inp=c.querySelector('#list-search');if(inp){inp.focus();inp.setSelectionRange(pos,pos)}}})}mountScannerIcons(c);const select=c.querySelector('#list-filter');if(select)select.addEventListener('change',e=>{filterValue=e.target.value;const page=prefs.page;const rerender={products:productsPage,losses:lossesPage,receipts:receiptsPage}[page];if(rerender){c.innerHTML=rerender();bindContent()}})}
  $('#overlay-mobile').addEventListener('click',()=>{$('#sidebar').classList.remove('open');$('#overlay-mobile').classList.remove('show')});window.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#scanner-root')?.firstElementChild)closeScanner();else if(e.key==='Escape'&&modalState)closeModal()});window.addEventListener('storage',e=>{if(e.key===ACCOUNTS_KEY){const own=accounts().find(a=>a.id===sessionUser?.id&&a.active);if(sessionUser&&!own){logout();toast('Seu acesso foi alterado em outra aba.',true)}else if(sessionUser)render()}if(e.key===KEY){if(!cloudEnabled){db=loadData();render();toast('Dados locais atualizados de outra aba.')}else if(!cloudBusy)cloudPull({quiet:true,preserveModal:!!modalState}) }});
  boot();
  </script>
